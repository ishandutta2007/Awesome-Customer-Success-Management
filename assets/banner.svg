<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#primaryGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .card-text-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #f1f5f9;
    }
    .card-text-val {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #34d399;
    }
    .card-text-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }

    /* Dynamic / Animated Aspects */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.75; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes rippleWave {
      0% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.5; transform: scale(1.02); }
      100% { opacity: 0.2; transform: scale(0.98); }
    }

    .anim-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .anim-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .anim-flow {
      stroke-dasharray: 8 6;
      animation: pulseLine 6s linear infinite;
    }
    .anim-pill-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .anim-pill-2 {
      animation: floatPill 5s ease-in-out infinite 2.5s;
    }
  </style>

  <!-- 1. Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- 2. Grid Layer -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- 3. Dynamic Animated Ambient Glow Orbs in Background -->
  <circle class="anim-orb-1" cx="220" cy="120" r="140" fill="#6366f1" opacity="0.3" filter="url(#glowFilter)" />
  <circle class="anim-orb-2" cx="980" cy="260" r="160" fill="#38bdf8" opacity="0.25" filter="url(#glowFilter)" />
  <circle cx="600" cy="380" r="120" fill="#a855f7" opacity="0.2" filter="url(#glowFilter)" />

  <!-- 4. Subtle Dynamic Flow Wave Lines (Customer Success Pipeline) -->
  <path class="anim-flow" d="M -50 340 C 250 260, 450 380, 750 300 C 950 240, 1100 320, 1250 270" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.35" />
  <path class="anim-flow" d="M -50 370 C 300 310, 500 400, 800 320 C 1000 270, 1150 350, 1250 300" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.25" />

  <!-- 5. Interactive Cards on Right Side (SaaS & CS Signals) -->
  <g transform="translate(780, 50)" class="anim-pill-1">
    <!-- Card 1: Health Score -->
    <rect x="0" y="0" width="370" height="85" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="36" cy="42" r="18" fill="#10b981" fill-opacity="0.2" />
    <path d="M 28 42 L 34 48 L 45 36" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="36" class="card-text-title">Customer Health Score</text>
    <text x="68" y="62" class="card-text-val">98.4% <tspan class="card-text-sub">Optimal Tier</tspan></text>
    <rect x="290" y="24" width="62" height="24" rx="12" fill="#059669" fill-opacity="0.3" />
    <text x="321" y="40" font-family="system-ui" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">+4.2%</text>
  </g>

  <g transform="translate(780, 155)" class="anim-pill-2">
    <!-- Card 2: Churn Prediction -->
    <rect x="0" y="0" width="370" height="85" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="36" cy="42" r="18" fill="#6366f1" fill-opacity="0.2" />
    <path d="M 28 46 L 36 38 L 44 42" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="36" class="card-text-title">Net Revenue Retention (NRR)</text>
    <text x="68" y="62" class="card-text-val" style="fill: #818cf8;">124% <tspan class="card-text-sub">ARR Expansion</tspan></text>
    <rect x="275" y="24" width="77" height="24" rx="12" fill="#4f46e5" fill-opacity="0.3" />
    <text x="313" y="40" font-family="system-ui" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">Automated</text>
  </g>

  <g transform="translate(780, 260)" class="anim-pill-1">
    <!-- Card 3: Retention Playbooks -->
    <rect x="0" y="0" width="370" height="85" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="36" cy="42" r="18" fill="#38bdf8" fill-opacity="0.2" />
    <circle cx="36" cy="42" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="68" y="36" class="card-text-title">Automated Playbooks</text>
    <text x="68" y="62" class="card-text-val" style="fill: #38bdf8;">Real-Time <tspan class="card-text-sub">Early Warnings</tspan></text>
    <rect x="285" y="24" width="67" height="24" rx="12" fill="#0284c7" fill-opacity="0.3" />
    <text x="318" y="40" font-family="system-ui" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">Active</text>
  </g>

  <!-- 6. Foreground Title & Header Section (Clear, unobstructed, high contrast) -->
  <g transform="translate(60, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="235" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="29" y="21" class="badge-text">CURATED CS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title-text">Awesome Customer</text>
    <text x="0" y="215" class="title-text">Success Management</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="265" class="subtitle-text">
      The authoritative index of enterprise SaaS platforms, AI copilots,
    </text>
    <text x="0" y="295" class="subtitle-text">
      and open-source customer health scoring &amp; retention infrastructure.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="18" font-family="system-ui" font-size="12" font-weight="600" fill="#cbd5e1">🎯 Health Scoring</text>

      <rect x="145" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="159" y="18" font-family="system-ui" font-size="12" font-weight="600" fill="#cbd5e1">🔮 Churn Prediction</text>

      <rect x="295" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="309" y="18" font-family="system-ui" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Automated Playbooks</text>

      <rect x="460" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="474" y="18" font-family="system-ui" font-size="12" font-weight="600" fill="#cbd5e1">🔓 Open Source CS</text>
    </g>
  </g>
</svg>
